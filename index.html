<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#c86f92" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="manifest.webmanifest?v=15" />
  <link rel="icon" type="image/png" href="icons/app-icon-128.png?v=15" />
  <link rel="apple-touch-icon" href="icons/app-icon-128.png?v=15" />
  <link rel="stylesheet" href="styles.css?v=15" />
  <link rel="stylesheet" href="ui-v13.css?v=15" />
  <link rel="stylesheet" href="ui-cleanup-v13.css?v=15" />
  <link rel="stylesheet" href="ui-typography-v14.css?v=15" />
</head>
<body>
  <div id="app"></div>
  <script src="data.js?v=15"></script>
  <script src="sheet-mirror.js?v=15"></script>
  <script src="sheet-extra.js?v=15"></script>
  <script src="summary-full.js?v=15"></script>
  <script src="sheet-sync.js?v=15"></script>
  <script src="sheet-sync-v12.js?v=15"></script>
  <script src="app.js?v=15"></script>
  <script src="sheet-patch.js?v=15"></script>
  <script src="summary-patch.js?v=15"></script>
  <script src="ui-patch-v13.js?v=15"></script>
  <script src="ui-cleanup-v13.js?v=15"></script>
  <script src="state-stable-v15.js?v=15"></script>
  <script src="ui-fix-v14.js?v=15"></script>
  <script>
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
    let lastTouchEnd=0;
    document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},{passive:false});
  </script>
</body>
</html>
