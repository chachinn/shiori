<body>
  <div id="app"></div>
  <noscript>Shiori needs JavaScript enabled. Visit repair.html if the app is blank.</noscript>
  <script>
  (function(){
    var failed=false;
    function recovery(){
      var app=document.getElementById('app');
      if(!app||app.querySelector('main'))return;
      app.innerHTML='<main style="font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;padding:28px;max-width:520px;margin:12vh auto;color:#45303b"><h1 style="font-size:26px">🌸 Shiori needs to reload</h1><p>An app file failed to start. Your local trip progress has not been cleared.</p><a href="repair.html" style="display:block;padding:14px;border-radius:14px;background:#bd678d;color:white;text-align:center;text-decoration:none;font-weight:bold">Repair app files (keep saved progress)</a><p style="font-size:14px">Connect to the internet first. Do not delete the app or Safari website data.</p></main>';
    }
    window.addEventListener('error',function(){failed=true;},true);
    window.addEventListener('unhandledrejection',function(){failed=true;});
    window.addEventListener('load',function(){setTimeout(function(){if(failed||!document.querySelector('#app main'))recovery();},600);});
  })();
  </script>

  <script>
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
    let lastTouchEnd=0;
    document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},{passive:false});
  </script>
